cargo-features = ["profile-rustflags"]

[features]
benchmarking = []

[package]
name = "flexalign"
version = "0.1.0"
edition = "2021"
channel = "nightly"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Pinned to exact revisions so a build anywhere -- a cluster, a fresh checkout, CI -- produces the
# binary these benchmarks measured. Two reasons this is not optional here:
#   * `branch = "zeroable-load"` pointed at a branch 5 commits BEHIND the `zeroable_load` branch the
#     local path override actually built (SIMD + prefetch key lookup missing). Local and remote
#     builds were silently different code.
#   * flexmap owns the on-disk index format. A moving dependency can change it under a prebuilt
#     index, which has already caused one silent accuracy regression in this project.
# To advance a dependency: push it, then bump the rev here deliberately.
# Caveat: flexmap pulls its own bioreader/kmerrs at unpinned revs, so the graph carries a second
# copy of each. Cargo refuses to unify them ("patches must point to different sources"), so closing
# that gap means pinning inside flexmap's own manifest.
kmerrs = { git = "https://github.com/4less/kmerr.git", rev = "3b86438d083ba83d334ba19a5f5a45ad045f247d" }
flexmap = { git = "https://github.com/4less/flexmap.git", rev = "cebfd562b073e7ac09a83817bec62ab9059f6586" }
bioreader = { git = "https://github.com/4less/bioreader.git", rev = "1ba00bb9055ec71334c87576e12023f994dd1390" }
libwfa2 = "0.1.1"
clap = { version = "4.5.3", features = ["derive", "wrap_help"] }
clap_derive = "4.5.3"
flate2 = "1.0.28"
gzp = "0.11.3"
savefile = { version="0.17", feature="derive" }
savefile-derive = "0.17"
popcnt = "0.1.0"
colored = "2.1.0"
anstyle = "1.0.8"
glidesort = { version="0.1.2", feature="unstable" }
serde = { version = "1.0.207", features = ["derive"] }
serde_derive = "1.0.207"
serde_json = "1.0"
bincode = { version = "2.0.0-rc.3" }
textplots = "0.8.6"
rgb = "0.8.48"
micromap = "0.0.15"
ser_raw = "0.1.0"
triple_accel = "0.4.0"
memmap2 = "0.9.4"
thiserror = "1.0.64"
simple_logger=  { version = "3", features = ["stderr"] }
log = "0"
itertools = "0.13.0"
stats = "0.0.1"
derive_builder = "0.20.2"


[profile.release]
opt-level = 3               # Use best optimizations
overflow-checks = false     # Disable integer overflow checks.
rustflags = ["-C", "target-feature=+avx,+sse3,+avx2,+fma"]#
lto = "fat"

